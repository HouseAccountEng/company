# Omakase Ruby styling, which the rest of this file bends to the house style
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  # Adopt every cop a new release brings, rather than pinning to today's set
  NewCops: enable
  # An extension we decline is declined in this file, not merely ignored
  SuggestExtensions: false

# We never freeze a string, so the magic comment has nothing to say
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

# The cop demands '.freeze' on string constants and cannot skip them
Style/MutableConstant:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: single_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Layout/CaseIndentation:
  EnforcedStyle: end
  IndentOneStep: true

Layout/LineLength:
  Enabled: true
  Max: 100

# 'private' sits at the level of 'class', so it reads as a divider
Layout/AccessModifierIndentation:
  Enabled: true
  EnforcedStyle: outdent

# One 'include' statement carries the list, split only when it will not fit
Style/MixinGrouping:
  Enabled: true
  EnforcedStyle: grouped

# Omit parentheses on a call's arguments, keeping the inner ones parsing needs -- but a line
# carrying an `if` keeps them, and 'omit_parentheses' has no option for that exception, so the
# rule lives in the shared STYLE.md and in review rather than here
Style/MethodCallWithArgsParentheses:
  Enabled: false
